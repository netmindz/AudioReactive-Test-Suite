[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audioreactive-test-suite"
version = "0.1.0"
description = "Capture and compare WLED Audio Sync v2 streams."
requires-python = ">=3.11"

[project.scripts]
audioreactive-suite = "audioreactive_suite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
